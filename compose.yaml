services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notereview
      MYSQL_USER: reviewer
      MYSQL_PASSWORD: ${REVIEW_DB_PASSWORD:-localreview}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - review-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: note-archive
      MINIO_ROOT_PASSWORD: ${LIBRARY_STORAGE_PASSWORD:-local-note-archive}
    volumes:
      - originals:/data
  rabbitmq:
    image: rabbitmq:4.1
    environment:
      RABBITMQ_DEFAULT_USER: note-worker
      RABBITMQ_DEFAULT_PASS: ${LIBRARY_QUEUE_PASSWORD:-local-note-queue}
    volumes:
      - broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - vectors:/qdrant/storage
  analyzer:
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIBRARY_MINIO_ENDPOINT: minio:9000
      LIBRARY_MINIO_USER: note-archive
      LIBRARY_MINIO_PASSWORD: ${LIBRARY_STORAGE_PASSWORD:-local-note-archive}
      LIBRARY_RABBIT_HOST: rabbitmq
      LIBRARY_RABBIT_USER: note-worker
      LIBRARY_RABBIT_PASSWORD: ${LIBRARY_QUEUE_PASSWORD:-local-note-queue}
      LIBRARY_QDRANT_URL: http://qdrant:6333
      HARNESS_INTENT_BASE_URL: ${HARNESS_INTENT_BASE_URL:-http://host.docker.internal:18087/v1}
      HARNESS_INTENT_MODEL: ${HARNESS_INTENT_MODEL:-notes-qwen-3b}
      HARNESS_INTENT_API_KEY: ${HARNESS_INTENT_API_KEY:-}
      HARNESS_PLANNER: ${HARNESS_PLANNER:-offline}
      HARNESS_BASE_URL: ${HARNESS_BASE_URL:-}
      HARNESS_MODEL: ${HARNESS_MODEL:-}
      HARNESS_API_KEY: ${HARNESS_API_KEY:-}
    volumes:
      - harness-state:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/analysis',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  workbench:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notereview?characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: reviewer
      SPRING_DATASOURCE_PASSWORD: ${REVIEW_DB_PASSWORD:-localreview}
      REVIEW_HARNESS_URL: http://analyzer:8000/harness/stream
      REVIEW_LIBRARY_URL: http://analyzer:8000/library
      REVIEW_ARCHIVE_URL: http://analyzer:8000/infra/archive
      REVIEW_RESTORE_URL: http://analyzer:8000/infra/restore
      REVIEW_ENQUEUE_URL: http://analyzer:8000/infra/enqueue
      REVIEW_DEQUEUE_URL: http://analyzer:8000/infra/dequeue
      REVIEW_ANALYZER_URL: http://analyzer:8000/analysis
    ports: ["127.0.0.1:8765:8765"]
volumes:
  review-data:
  harness-state:
  originals:
  broker:
  vectors:
