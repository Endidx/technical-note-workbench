name: Verify workbench

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBRARY_ENCODER: concept
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test the backend
        run: ./backend/mvnw -B -ntp -f backend/pom.xml package
      - name: Verify batch review and ZIP export
        run: python3 scripts/verify_batch.py
      - name: Verify clarification and selective approval
        run: python3 scripts/verify_clarification.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test the frontend and verify checked-in assets
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../web/app.js ../web/app.css
