name: Verify workbench

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBRARY_ENCODER: concept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test the backend
        run: mvn -B -ntp -f backend/pom.xml package
      - name: Verify batch review and ZIP export
        run: python3 scripts/verify_batch.py
      - name: Verify clarification and selective approval
        run: python3 scripts/verify_clarification.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test the frontend and verify checked-in assets
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../web/app.js ../web/app.css
